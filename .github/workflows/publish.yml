name: Publish

# Every push to master runs CI, then packs every package and pushes them to nuget.org, in dependency order:
#   1. Jakar.Json (the core, with its source generator);
#   2. Jakar.Json.SystemTextJson and Jakar.Json.Http, which other integration packages reference;
#   3. every other integration package (Jakar.Json.<Host>), found by the Jakar.Json.*/Jakar.Json.*.csproj convention.
# A version that's already on nuget.org is skipped, so a release is a commit that bumps <Version> in a project file
# (<.NET major>.<library major>.<library minor>), and an unchanged package is never re-published.
# Jakar.Spans must be on nuget.org first (it's published from its own repository).
#
# nuget.org Trusted Publishing (no stored API key): the repository needs
#   - a Trusted Publishing policy on nuget.org: owner Jakar510, repository Jakar.Json, workflow file publish.yml, environment production
#     (the publish job runs in the GitHub environment "production", which GitHub creates on first use);
#   - NUGET_USER: the nuget.org profile name (not the email address), as a repository variable or a secret.

on:
  push:
    branches: [ master ]
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    name: Pack and push to nuget.org
    needs: ci
    runs-on: ubuntu-latest
    # Must match the environment in the nuget.org Trusted Publishing policy: the OIDC token carries it, and the policy rejects any other.
    environment: production
    permissions:
      contents: read
      id-token: write # GitHub OIDC token for nuget.org Trusted Publishing
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Use nuget.org only
        run: dotnet nuget remove source LocalNuGet --configfile nuget.config

      # Jakar.Json packs its source generator and code fixes (analyzers/dotnet/cs) from their Release builds.
      # Test projects, the generator projects, benchmarks and the sample web app aren't packages.
      - name: Pack
        shell: bash
        run: |
          set -euo pipefail

          dotnet pack Jakar.Json/Jakar.Json.csproj -c Release -o artifacts/1-core

          # The integrations reference this Jakar.Json package (Release), which isn't on nuget.org until the push below.
          dotnet nuget add source "$PWD/artifacts/1-core" --name LocalJakarJson --configfile nuget.config

          base=(Jakar.Json.SystemTextJson Jakar.Json.Http)
          for name in "${base[@]}"; do
            dotnet pack "$name/$name.csproj" -c Release -o artifacts/2-base
          done

          for csproj in Jakar.Json.*/Jakar.Json.*.csproj; do
            name=$(basename "$csproj" .csproj)
            case "$name" in
              *.Tests|Jakar.Json.Generator*|Jakar.Json.Benchmarks|Jakar.Json.Tests.WebApi|Jakar.Json.SystemTextJson|Jakar.Json.Http) continue ;;
            esac
            dotnet pack "$csproj" -c Release -o artifacts/3-integrations
          done

          echo "Packed:"
          find artifacts -name '*.nupkg' -printf '  %P\n' | sort

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/**

      # The nuget.org profile name isn't a secret: a repository variable (Settings → Secrets and variables → Actions → Variables) or a secret both work.
      - name: Check the nuget.org user is configured
        shell: bash
        env:
          NUGET_USER: ${{ vars.NUGET_USER || secrets.NUGET_USER }}
        run: |
          if [ -z "$NUGET_USER" ]; then
            echo "::error title=NUGET_USER is not set::Add a repository variable (or secret) named NUGET_USER holding your nuget.org profile name (not your email), then re-run this workflow."
            exit 1
          fi

      - name: NuGet login (OIDC → short-lived API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ vars.NUGET_USER || secrets.NUGET_USER }}

      # In dependency order; each push also sends the .snupkg next to the .nupkg.
      - name: Push
        shell: bash
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          set -euo pipefail

          for tier in 1-core 2-base 3-integrations; do
            for package in artifacts/$tier/*.nupkg; do
              dotnet nuget push "$package" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
            done
          done
